<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Age Check - ZK Proof</title>
  <script src="https://cdn.jsdelivr.net/npm/snarkjs@0.7.4/build/snarkjs.min.js"></script>
  <script src="/zk-client.js"></script>
</head>
<body>
  <h1>Age Check</h1>
  <p>Proves you are at least 18 without revealing your actual age.</p>

  <label>Your age (stays in your browser):</label><br />
  <input id="age" type="number" value="25" /><br /><br />

  <label>Minimum age threshold (sent to server):</label><br />
  <input id="threshold" type="number" value="18" /><br /><br />

  <button onclick="run()">Prove &amp; Submit</button>

  <p id="status"></p>
  <pre id="result"></pre>

  <script>
    async function run() {
      if (!window.snarkjs) {
        document.getElementById("status").textContent =
          "Error: ZK library still loading, please wait a moment and try again.";
        return;
      }
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      status.textContent = "Step 1/3: Fetching circuit files...";
      result.textContent = "";

      try {
        const age = document.getElementById("age").value;
        const threshold = document.getElementById("threshold").value;

        const allInputs = { age, threshold };

        status.textContent = "Step 2/3: Generating proof locally (0.2-0.5s)...";

        const { proof, publicSignals } = await window.zkClient.generateProof("age_18", allInputs);

        status.textContent = "Step 3/3: Submitting proof to server...";

        const response = await window.zkClient.submitCompliance("age_18", proof, publicSignals);

        status.textContent = response.compliant ? "OK: Compliant" : "Not compliant";
        result.textContent = JSON.stringify({ publicSignals, response }, null, 2);
      } catch (err) {
        status.textContent = "Error: " + err.message;
        console.error(err);
      }
    }
  </script>
</body>
</html>
